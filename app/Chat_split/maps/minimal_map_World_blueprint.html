    - iXMaps embed using the leaflet_vt service with VT_BASIC_LIGHT basemap
    - Additional TopoJSON outline layer providing reference boundaries

    - ../../../ui/js/ixmaps.js
    - CNTR_RG_10M_2020 TopoJSON for outlines

    Use as a quick visual prototype for blueprint-style thematic maps.

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>iXMaps example</title>
</head>

<body style="margin:0;padding:0">
    <div id="map_div" style="width:100%;height:550px"></div>

    <script src="https://gjrichter.github.io/ixmaps-flat/ui/js/ixmaps.js"></script>

    <script>
        // Minimal map setup
        ixmaps.Map('map_div', {
            mapService: "leaflet_vt",
            maptype: "VT_BASIC_LIGHT",
            align: ""
        }).then(map => { map
            .view([13.239945499286312, 23.203125000000004], 1)
            .options({
                basemapopacity: "0.5",
                hideOnPan: "false",
                freezeOnPan: "false"
            })

            // World countries layer
            // this layer can be used as geografic reference for the chart layer

            .layer(
                ixmaps.Layer("World_countries")
                    .data({
                        url: "https://s3.eu-central-1.amazonaws.com/maps.ixmaps.com/topojson/CNTR_RG_10M_2020_4326.json",
                        type: "topojson"
                    })
                    .style({
                        colorscheme: [
                            "#eeeeee"],
                        fillopacity: "0.1",
                        showdata: "true",
                        linecolor: [
                            "#0088dd"],
                        linewidth: "0.5"
                    })
                    .meta({
                        title: "Countries of the world]",
                        snippet: "",
                        description: "",
                        name: "World_countries",
                        tooltip: "{{theme.item.chart}}{{theme.item.data}}"
                    })
                    .json()
            )
        });
    </script>
</body>

</html>
